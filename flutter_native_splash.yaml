flutter_native_splash:
  # --- General Settings ---
  web: false
  fullscreen: true
  branding_mode: bottom
  branding_bottom_padding: 22

  # --- Light Mode ---
  color: "#FFFFFF"
  image: assets/images/logo_except12.png
  branding: assets/images/branding_except12.png

  # --- Dark Mode ---
  color_dark: "#121312"
  image_dark: assets/images/logo_except12.png
  branding_dark: assets/images/branding_except12.png

  # --- Android 12+ Configuration ---
  android_12:
    # Android 12 Light
    color: "#FFFFFF"
    image: assets/images/light_splash_logo.png
    branding: assets/images/light_branding.png

    # Android 12 Dark
    color_dark: "#121312"
    image_dark: assets/images/dark_splash_logo.png
    branding_dark: assets/images/dark_branding.png
